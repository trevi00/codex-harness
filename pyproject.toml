[project]
name = "codex-self-harness"
version = "0.1.0"
description = "A script-driven, hexagonal foundation for a self-improving Codex organization"
requires-python = ">=3.12"
dependencies = [
  "fastembed>=0.8.0",
  "filelock>=3.20,<4",
  "jsonschema[format]>=4.23,<5",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6,<7",
  "redis>=5.2,<7",
  "tree-sitter>=0.24,<0.26",
  "tree-sitter-python>=0.23,<0.26",
]

[project.scripts]
harness = "codex_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the project's PostgreSQL and Redis services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
